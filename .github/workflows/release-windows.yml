name: Release Windows installer

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    environment: windows-release
    steps:
      - uses: actions/checkout@v4

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$version" "installer\ClipWatcher.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

      - name: Sign installer
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE_BASE64 -or
              -not $env:WINDOWS_CERTIFICATE_PASSWORD) {
            throw "Configure both signing secrets in the windows-release environment before releasing."
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP "windows-signing.pfx"
          $installerPath = "dist\installer\ClipWatcher-Setup.exe"
          try {
            [IO.File]::WriteAllBytes(
              $certificatePath,
              [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))

            $signToolCommand = Get-Command signtool.exe -ErrorAction SilentlyContinue
            if ($signToolCommand) {
              $signToolPath = $signToolCommand.Source
            } else {
              $kitsPath = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\bin"
              $signToolFile = Get-ChildItem -Path $kitsPath -Filter signtool.exe -Recurse |
                Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
                Sort-Object FullName -Descending |
                Select-Object -First 1
              if ($signToolFile) {
                $signToolPath = $signToolFile.FullName
              }
            }
            if (-not $signToolPath) {
              throw "Windows SDK SignTool was not found on the runner."
            }

            & $signToolPath sign /f $certificatePath `
              /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 `
              /tr https://timestamp.digicert.com /td SHA256 $installerPath
            if ($LASTEXITCODE -ne 0) {
              throw "Signing failed with exit code $LASTEXITCODE"
            }

            & $signToolPath verify /pa /v $installerPath
            if ($LASTEXITCODE -ne 0) {
              throw "Signature verification failed with exit code $LASTEXITCODE"
            }
          }
          finally {
            Remove-Item -LiteralPath $certificatePath -Force -ErrorAction SilentlyContinue
          }

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            dist\installer\ClipWatcher-Setup.exe `
            --title "Clip Watcher $env:GITHUB_REF_NAME" `
            --generate-notes
